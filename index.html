<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><title>Disponibilità Prodotti</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;min-height:100vh;-webkit-text-size-adjust:100%}
.header{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;color:#fff;position:sticky;top:0;z-index:10}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.header-title{font-weight:800;font-size:19px}
.header-sub{font-size:12px;opacity:.85;margin-top:2px}
.btn-upload{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-block}
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px}
#searchInput{width:100%;padding:12px 12px 12px 38px;border-radius:10px;border:none;font-size:16px;outline:none;-webkit-appearance:none}
.main{max-width:600px;margin:0 auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent}
.stat-val{font-size:22px;font-weight:800}
.stat-lbl{font-size:11px;font-weight:600}
.stat-ok{background:#f0fdf4;color:#10b981}.stat-ok.active{background:#10b981;border-color:#10b981}
.stat-ok.active .stat-val,.stat-ok.active .stat-lbl{color:#fff}
.stat-low{background:#fffbeb;color:#f59e0b}.stat-low.active{background:#f59e0b;border-color:#f59e0b}
.stat-low.active .stat-val,.stat-low.active .stat-lbl{color:#fff}
.stat-out{background:#fef2f2;color:#ef4444}.stat-out.active{background:#ef4444;border-color:#ef4444}
.stat-out.active .stat-val,.stat-out.active .stat-lbl{color:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat-btn{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1.5px solid #e5e7eb;background:#fff;color:#374151;font-size:13px;font-weight:600;cursor:pointer}
.cat-btn.active{background:#6366f1;border-color:#6366f1;color:#fff}
.count{font-size:13px;color:#9ca3af;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-left:4px solid}
.card-name{font-weight:700;font-size:15px;color:#111;line-height:1.3;overflow-wrap:anywhere}
.color-chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 5px;border-radius:20px;background:#f3f4f6;font-size:12.5px;font-weight:600;color:#374151}
.color-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex-shrink:0}
.card-meta{font-size:12px;color:#9ca3af;margin-top:5px}
.card-right{text-align:right;flex-shrink:0}
.badge{display:inline-block;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge-ok{background:#f0fdf4;color:#10b981}
.badge-low{background:#fffbeb;color:#f59e0b}
.badge-out{background:#fef2f2;color:#ef4444}
.qty{font-size:13px;color:#6b7280;margin-top:4px}
.empty{text-align:center;padding:40px 0;color:#9ca3af}
.dropzone{margin-top:20px;border:2px dashed #e5e7eb;border-radius:12px;padding:20px;text-align:center;color:#9ca3af;font-size:13px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;padding:24px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:800;color:#111;margin-bottom:4px}
.modal-sub{font-size:13px;color:#6b7280;margin-bottom:20px}
.field-lbl{font-size:14px;font-weight:600;color:#374151;display:block;margin-bottom:6px}
.field-sel{width:100%;padding:12px;border-radius:8px;border:1.5px solid #d1d5db;font-size:16px;background:#fff;margin-bottom:14px}
.btn-apply{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
@media (max-width:380px){.card{flex-direction:column}.card-right{text-align:left;display:flex;align-items:center;gap:10px}.qty{margin-top:0}}
</style></head><body>
<div class="header"><div style="max-width:600px;margin:0 auto">
<div class="header-top"><div><div class="header-title">🏪 Disponibilità Prodotti</div><div class="header-sub" id="fileName">Dati aggiornati al 4/6/2026</div></div>
<label class="btn-upload">📂 Carica<input type="file" accept=".xlsx,.xls,.csv" style="display:none" id="fileInput"/></label></div>
<div class="search-wrap"><span class="search-icon">🔍</span><input id="searchInput" placeholder="Cerca per nome o codice..." autocomplete="off"/></div>
</div></div>
<div class="main">
<div class="stats">
<div class="stat stat-ok" id="statOk" onclick="toggleFilter('ok')"><div class="stat-val" id="valOk">0</div><div class="stat-lbl">Disponibili</div></div>
<div class="stat stat-low" id="statLow" onclick="toggleFilter('low')"><div class="stat-val" id="valLow">0</div><div class="stat-lbl">Scorta bassa</div></div>
<div class="stat stat-out" id="statOut" onclick="toggleFilter('out')"><div class="stat-val" id="valOut">0</div><div class="stat-lbl">Esauriti</div></div>
</div>
<div class="cats" id="cats"></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>
<div class="dropzone" id="dropzone">📁 Trascina qui il tuo file Excel o CSV per aggiornare i dati</div>
</div>
<div class="overlay" id="overlay"><div class="modal">
<div class="modal-title">📋 Associa le colonne</div><div class="modal-sub" id="modalSub"></div>
<label class="field-lbl">📦 Nome prodotto</label><select class="field-sel" id="colName"></select>
<label class="field-lbl">🔢 Quantità</label><select class="field-sel" id="colQty"></select>
<label class="field-lbl">🏷️ Codice / SKU</label><select class="field-sel" id="colCode"></select>
<label class="field-lbl">📁 Categoria</label><select class="field-sel" id="colCat"></select>
<button class="btn-apply" onclick="applyMapping()">✅ Carica prodotti</button>
</div></div>
<script>
var products=[{"Codice":"525000317","Prodotto":"Cybex Gold ORFEO TPE Almond Beige | beige","Categoria":"","Quantità":6},{"Codice":"525000011","Prodotto":"Melio CARBON Almond Beige | beige","Categoria":"","Quantità":1},{"Codice":"524000111","Prodotto":"Cybex Gold EEZY S TWIST+ 2 TPE Stormy Blue | light blue","Categoria":"","Quantità":0},{"Codice":"526000847","Prodotto":"NEW  - EEZY S TWIST+ 2 TPE Almond Beige | beige","Categoria":"","Quantità":3},{"Codice":"526000843","Prodotto":"NEW - EEZY S TWIST+ 2 BLK Magic Black | black","Categoria":"","Quantità":-1},{"Codice":"524000087","Prodotto":"Cybex Gold EEZY S TWIST+ 2 BLK Magic Black | black","Categoria":"","Quantità":0},{"Codice":"524000151","Prodotto":"Cybex Gold BEEZY BLK Fog Grey | light grey","Categoria":"","Quantità":1},{"Codice":"525000381","Prodotto":"Cybex ORFEO BLK Fog Grey | light grey","Categoria":"","Quantità":2},{"Codice":"526000859","Prodotto":"NEW  - BEEZY BLK Magic Black | black","Categoria":"","Quantità":2},{"Codice":"526001079","Prodotto":" NEW  - ORFEO TPE Chocolate Brown | brown","Categoria":"","Quantità":-1},{"Codice":"526000851","Prodotto":"NEW  - EEZY S TWIST+ 2 TPE Stormy Blue | light blue","Categoria":"","Quantità":0},{"Codice":"525000349","Prodotto":"Cybex  ORFEO BLK Candy Pink | light pink","Categoria":"","Quantità":0},{"Codice":"526000891","Prodotto":"NEW  - BEEZY BLK Moss Green | khaki","Categoria":"","Quantità":1},{"Codice":"526001031","Prodotto":"NEW  - ORFEO TPE Almond Beige | beige ","Categoria":"","Quantità":1},{"Codice":"526001019","Prodotto":"NEW  - ORFEO BLK Magic Black | black","Categoria":"","Quantità":3},{"Codice":"526000791","Prodotto":"NEW  - MELIO CARBON  Chocolate Brown | brown","Categoria":"","Quantità":-1},{"Codice":"526000759","Prodotto":"NEW  - MELIO CARBON  Magic Black | black","Categoria":"","Quantità":1},{"Codice":"525000445","Prodotto":"Cybex Melio CARBON Moss Green | khaki","Categoria":"","Quantità":1},{"Codice":"526000867","Prodotto":" NEW  - BEEZY BLK Almond Beige | beige","Categoria":"","Quantità":0},{"Codice":"525000763","Prodotto":"Cybex Agis BLK/Magic Black-black ","Categoria":"","Quantità":8},{"Codice":"526000875","Prodotto":" NEW  - BEEZY BLK Stormy Blue | light blue","Categoria":"","Quantità":1},{"Codice":"526000883","Prodotto":"NEW - BEEZY BLK Candy Pink | light pink","Categoria":"","Quantità":-1},{"Codice":"526000779","Prodotto":"NEW  - MELIO CARBON  Candy Pink | light pink","Categoria":"","Quantità":0},{"Codice":"525000769","Prodotto":"Cybex Agis BLK/Almond Beige-beige ","Categoria":"","Quantità":8},{"Codice":"526000797","Prodotto":"NEW  - MELIO CARBON  Dune Grey | grey","Categoria":"","Quantità":1},{"Codice":"526001043","Prodotto":" NEW - ORFEO TPE Stormy Blue | light blue","Categoria":"","Quantità":2},{"Codice":"526000907","Prodotto":"NEW - BEEZY BLK Dune Grey | grey","Categoria":"","Quantità":4},{"Codice":"525000775","Prodotto":"Cybex Agis BLK/Stormy Blue-light blue ","Categoria":"","Quantità":9},{"Codice":"526001067","Prodotto":"NEW - ORFEO TPE Moss Green | khaki","Categoria":"","Quantità":0},{"Codice":"526000855","Prodotto":"NEW  - EEZY S TWIST+ 2 BLK Dune Grey | grey","Categoria":"","Quantità":0},{"Codice":"526000899","Prodotto":"NEW - BEEZY BLK Chocolate Brown | brown","Categoria":"","Quantità":1},{"Codice":"526001103","Prodotto":"NEW - ORFEO BLK Cinnamon Yellow | dark yellow","Categoria":"","Quantità":0},{"Codice":"526000803","Prodotto":"NEW  - MELIO CARBON  Cinnamon Yellow | dark yellow","Categoria":"","Quantità":1},{"Codice":"526000767","Prodotto":"NEW - MELIO CARBON  Almond Beige | beige","Categoria":"","Quantità":3},{"Codice":"526000915","Prodotto":"NEW - BEEZY BLK Cinnamon Yellow | dark yellow","Categoria":"","Quantità":0},{"Codice":"526000773","Prodotto":"NEW - MELIO CARBON  Stormy Blue | light blue","Categoria":"","Quantità":1},{"Codice":"526000785","Prodotto":"NEW  - MELIO CARBON  Moss Green | khaki","Categoria":"","Quantità":1},{"Codice":"LIBELLE2","Prodotto":"Cybex Passeggino Libelle ","Categoria":"","Quantità":0},{"Codice":"526000983","Prodotto":"NEW  - LIBELLE TPE Chocolate Brown | brown","Categoria":"","Quantità":0},{"Codice":"526000923","Prodotto":" NEW  - LIBELLE BLK Magic Black | black","Categoria":"","Quantità":0},{"Codice":"526000947","Prodotto":" NEW  - LIBELLE TPE Stormy Blue | light blue","Categoria":"","Quantità":0},{"Codice":"526000995","Prodotto":" NEW  - LIBELLE BLK Dune Grey | grey","Categoria":"","Quantità":0},{"Codice":"526000959","Prodotto":" NEW  - LIBELLE BLK Candy Pink | light pink","Categoria":"","Quantità":0},{"Codice":"526001007","Prodotto":" NEW  - LIBELLE BLK Cinnamon Yellow | dark yellow","Categoria":"","Quantità":0},{"Codice":"526001055","Prodotto":" NEW  - ORFEO BLK Candy Pink | light pink","Categoria":"","Quantità":1},{"Codice":"526001091","Prodotto":" NEW  - ORFEO BLK Dune Grey | grey","Categoria":"","Quantità":1},{"Codice":"526000935","Prodotto":" NEW - LIBELLE TPE Almond Beige | beige","Categoria":"","Quantità":0},{"Codice":"ORFEO-2026","Prodotto":"Cybex Passeggino Orfeo","Categoria":"","Quantità":9},{"Codice":"AGIS","Prodotto":"Cybex Passeggino Agis","Categoria":"","Quantità":25},{"Codice":"MELIO2","Prodotto":"Cybex Gold Melio Carbon ","Categoria":"","Quantità":7},{"Codice":"59639","Prodotto":"Cybex Gold Duo EEZY S TWIST+ 2 TPE Stormy Blue | light blue con cloud t","Categoria":"","Quantità":0},{"Codice":"TWIST2","Prodotto":"Cybex Eezy S Twist +2","Categoria":"","Quantità":2},{"Codice":"526000971","Prodotto":"NEW  - LIBELLE TPE Moss Green | khaki","Categoria":"","Quantità":0},{"Codice":"BEEZY2","Prodotto":"Passeggino Cybex Beezy","Categoria":"","Quantità":10}];
var activeFilter="tutti",rawData=null,rawCols=null;

var COLOR_MAP={"beige":"#d9c7a7","black":"#1f2937","light blue":"#7da3c7","light grey":"#c4c7cc","grey":"#8b8e94","brown":"#6b4a2f","khaki":"#7a7d54","light pink":"#f3b8c8","dark yellow":"#d9a514","blue":"#3b5f8f","pink":"#e88aa8","green":"#4a7a4f","white":"#f5f5f5","red":"#c0392b","navy":"#23365c","orange":"#d97a2b","yellow":"#e3c321"};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function parseColor(name){
  var n=String(name||"");
  var i=n.lastIndexOf("|");
  if(i===-1)return{name:n.replace(/\s{2,}/g," ").trim(),color:null,swatch:null};
  var base=n.slice(0,i).replace(/\s{2,}/g," ").trim();
  var key=n.slice(i+1).trim();
  // Eventuale testo extra dopo il colore (es. "light blue con cloud t")
  var extra="";var keyL=key.toLowerCase();var found=null;
  Object.keys(COLOR_MAP).sort(function(a,b){return b.length-a.length}).some(function(k){
    if(keyL.indexOf(k)===0){found=k;extra=key.slice(k.length).trim();return true;}
    return false;
  });
  if(!found)return{name:base,color:key,swatch:null};
  if(extra)base+=" "+extra;
  return{name:base,color:found,swatch:COLOR_MAP[found]};
}

function status(q){if(q<=0)return{label:"Non disponibile",cls:"badge-out",border:"#ef4444"};if(q<=5)return{label:"Scorta bassa",cls:"badge-low",border:"#f59e0b"};return{label:"Disponibile",cls:"badge-ok",border:"#10b981"};}

function render(){
  var q=document.getElementById("searchInput").value.toLowerCase();
  var filtered=products.filter(function(p){
    var mq=!q||String(p.Prodotto).toLowerCase().includes(q)||String(p.Codice).toLowerCase().includes(q);
    var mf=activeFilter==="tutti"||(activeFilter==="ok"&&p.Quantità>5)||(activeFilter==="low"&&p.Quantità>0&&p.Quantità<=5)||(activeFilter==="out"&&p.Quantità<=0)||p.Categoria===activeFilter;
    return mq&&mf;
  });
  document.getElementById("valOk").textContent=products.filter(function(p){return p.Quantità>5}).length;
  document.getElementById("valLow").textContent=products.filter(function(p){return p.Quantità>0&&p.Quantità<=5}).length;
  document.getElementById("valOut").textContent=products.filter(function(p){return p.Quantità<=0}).length;
  var cats=[...new Set(products.map(function(p){return p.Categoria}).filter(Boolean))];
  var ce=document.getElementById("cats");
  ce.innerHTML=cats.length?["tutti"].concat(cats).map(function(c){
    return'<button class="cat-btn'+(activeFilter===c?" active":"")+'" data-cat="'+esc(c)+'">'+esc(c.charAt(0).toUpperCase()+c.slice(1))+'</button>';
  }).join(""):"";
  document.getElementById("count").textContent=filtered.length+" prodott"+(filtered.length===1?"o":"i")+" trovati";
  var list=document.getElementById("list");
  if(!filtered.length){list.innerHTML='<div class="empty"><div style="font-size:40px">🔍</div><div style="margin-top:8px">Nessun prodotto trovato</div></div>';return;}
  list.innerHTML=filtered.map(function(p){
    var s=status(p.Quantità);
    var pc=parseColor(p.Prodotto);
    var chip=pc.color?'<div class="color-chip">'+(pc.swatch?'<span class="color-dot" style="background:'+pc.swatch+'"></span>':'')+esc(pc.color)+'</div>':'';
    return'<div class="card" style="border-color:'+s.border+'"><div style="flex:1;min-width:0"><div class="card-name">'+esc(pc.name)+'</div>'+chip+'<div class="card-meta">'+(p.Codice?'<span style="margin-right:8px">#'+esc(p.Codice)+'</span>':'')+esc(p.Categoria||'')+'</div></div><div class="card-right"><span class="badge '+s.cls+'">'+s.label+'</span>'+(p.Quantità>0?'<div class="qty">pz: <b>'+p.Quantità+'</b></div>':'')+'</div></div>';
  }).join("");
}

function toggleFilter(f){
  activeFilter=activeFilter===f?"tutti":f;
  document.querySelectorAll(".stat").forEach(function(el){el.classList.remove("active")});
  if(activeFilter!=="tutti"&&(f==="ok"||f==="low"||f==="out"))document.getElementById("stat"+f.charAt(0).toUpperCase()+f.slice(1)).classList.add("active");
  render();
}

document.getElementById("cats").addEventListener("click",function(e){
  var b=e.target.closest(".cat-btn");
  if(b){activeFilter=b.getAttribute("data-cat");document.querySelectorAll(".stat").forEach(function(el){el.classList.remove("active")});render();}
});

function parseFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{defval:""});
      if(!data.length){alert("Il file sembra vuoto.");return;}
      rawCols=Object.keys(data[0]);rawData=data;
      document.getElementById("fileName").textContent=file.name;
      document.getElementById("modalSub").textContent="File: "+file.name;
      var guess=function(hints){return rawCols.find(function(c){return hints.some(function(h){return c.toLowerCase().includes(h)});})||""};
      populateSelect("colName",guess(["prod","nome","desc","item","articolo"]));
      populateSelect("colQty",guess(["qta","qtà","qty","disp","stock","quant","giacenza"]));
      populateSelect("colCode",guess(["cod","sku","id","art"]),"— nessuna —");
      populateSelect("colCat",guess(["cat","tipo","gruppo"]),"— nessuna —");
      document.getElementById("overlay").classList.add("show");
    }catch(err){alert("Impossibile leggere il file: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function populateSelect(id,selected,emptyLabel){
  if(emptyLabel===undefined)emptyLabel=null;
  var sel=document.getElementById(id);
  sel.innerHTML=(emptyLabel!==null?'<option value="">'+esc(emptyLabel)+'</option>':"")+rawCols.map(function(c){
    return'<option value="'+esc(c)+'"'+(c===selected?' selected':'')+'>'+esc(c)+'</option>';
  }).join("");
}

function applyMapping(){
  var name=document.getElementById("colName").value;
  var qty=document.getElementById("colQty").value;
  var code=document.getElementById("colCode").value;
  var cat=document.getElementById("colCat").value;
  products=rawData.map(function(r){
    return{Codice:code?String(r[code]||""):"",Prodotto:name?String(r[name]||""):"",Categoria:cat?String(r[cat]||""):"",Quantità:qty?Number(r[qty])||0:0};
  }).filter(function(r){return r.Prodotto||r.Codice});
  document.getElementById("overlay").classList.remove("show");
  activeFilter="tutti";
  document.querySelectorAll(".stat").forEach(function(el){el.classList.remove("active")});
  render();
}

document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("fileInput").addEventListener("change",function(e){if(e.target.files[0])parseFile(e.target.files[0]);e.target.value="";});
var dz=document.getElementById("dropzone");
dz.addEventListener("dragover",function(e){e.preventDefault();dz.style.borderColor="#6366f1";dz.style.background="#eef2ff";});
dz.addEventListener("dragleave",function(){dz.style.borderColor="#e5e7eb";dz.style.background="";});
dz.addEventListener("drop",function(e){e.preventDefault();dz.style.borderColor="#e5e7eb";dz.style.background="";if(e.dataTransfer.files[0])parseFile(e.dataTransfer.files[0]);});
render();
</script></body></html>
